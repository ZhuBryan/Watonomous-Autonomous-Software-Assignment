map_memory_node:
  ros__parameters:
    resolution: 0.1
    width: 400              # 40m, arena is 30m
    height: 400
    origin_x: -20.0         # centers map on world origin
    origin_y: -20.0
    frame_id: sim_world     # same as odom
    update_distance: 1.5    # m moved before fusing again
    update_period_ms: 1000
    max_fuse_yaw_rate: 0.2  # rad/s, don't fuse while turning faster than this
